name: 'Environment Check'

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

jobs:
  check-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: latest
          cache: "npm"
      - run: npm install
      - run: npm run check-env
